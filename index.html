<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="title">Calculator</header>
    <main class="calculator-body">
      <div class="top-half-body">
        <input type="text" class="screen" />
        <div class="clear-delete-buttons">
          <div class="clear">CLEAR</div>
          <div class="delete">DELETE</div>
        </div>
      </div>
      <div id="main-buttons">
        <div class="small-button" id="seven">7</div>
        <div class="small-button" id="eight">8</div>
        <div class="small-button" id="nine">9</div>
        <div class="small-button" id="divide">÷</div>
        <div class="small-button" id="four">4</div>
        <div class="small-button" id="five">5</div>
        <div class="small-button" id="six">6</div>
        <div class="small-button" id="multiply">x</div>
        <div class="small-button" id="one">1</div>
        <div class="small-button" id="two">2</div>
        <div class="small-button" id="three">3</div>
        <div class="small-button" id="subtract">-</div>
        <div class="small-button" id="decimal">.</div>
        <div class="small-button" id="zero">0</div>
        <div class="small-button" id="equal">=</div>
        <div class="small-button" id="add">+</div>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
